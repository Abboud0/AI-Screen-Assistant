name: Build & Release (Tauri - Windows)

on:
  push:
    tags:
      - 'v*'                 # build when you push a tag like v0.1.0
  workflow_dispatch: {}      # allow manual runs from Actions tab

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Ensure there is something to bundle (static frontend)
      - name: Ensure dist exists (fallback)
        shell: pwsh
        run: |
          if (!(Test-Path "dist")) { New-Item -ItemType Directory -Path "dist" | Out-Null }
          if (!(Test-Path "dist/index.html")) {
            @"
              <!doctype html>
              <html><head><meta charset="utf-8"><title>Glint</title></head>
              <body><h1>Glint</h1><p>CI fallback page.</p></body></html>
            "@ | Set-Content "dist/index.html" -Encoding UTF8
          }
          Write-Host "Dist contents:"; Get-ChildItem -Recurse dist | Select-Object FullName

      - name: Set TAURI_CONFIG as inline JSON (no file)
        shell: pwsh
        run: |
          # Single-quoted so $schema isn’t interpolated by PowerShell
          $json = '{ "$schema":"https://schema.tauri.app/config/2","productName":"Glint","version":"0.1.0","identifier":"com.abbou.glint","build":{"frontendDist":"../dist"},"app":{"security":{"csp":null},"windows":[{"label":"main","title":"AI Screen Helper v0.1.0","url":"index.html"}]}}'
          "TAURI_CONFIG=$json" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "TAURI_CONFIG (inline) length:" $json.Length
          

      # Write a clean tauri.conf.json and verify it
      - name: Write & verify tauri.conf.json (no BOM, assert non-empty)
        shell: pwsh
        run: |
          $json = @'
          {
            "$schema": "https://schema.tauri.app/config/2",
            "productName": "Glint",
            "version": "0.1.0",
            "identifier": "com.abbou.glint",
            "build": { "frontendDist": "../dist" },
            "app": {
              "security": { "csp": null },
              "windows": [ { "label": "main", "title": "AI Screen Helper v0.1.0", "url": "index.html" } ]
            }
          }
          '@
          if (!(Test-Path "src-tauri")) { New-Item -ItemType Directory -Path "src-tauri" | Out-Null }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("src-tauri/tauri.conf.json", $json, $utf8NoBom)

          # Assert it's there and non-empty
          if (!(Test-Path "src-tauri/tauri.conf.json")) { throw "tauri.conf.json missing after write" }
          $f = Get-Item "src-tauri/tauri.conf.json"
          Write-Host "tauri.conf.json size:" $f.Length "bytes"
          if ($f.Length -lt 40) { throw "tauri.conf.json unexpectedly small; aborting" }

          # Show first line + hex of first 8 bytes (to prove no BOM)
          $first = Get-Content -Raw "src-tauri/tauri.conf.json" | Select-Object -First 1
          Write-Host "first chars:" $first.Substring(0, [Math]::Min(20, $first.Length))
          $bytes = [System.IO.File]::ReadAllBytes("src-tauri/tauri.conf.json")[0..7]
          $hex = ($bytes | ForEach-Object { $_.ToString("X2") }) -join " "
          Write-Host "first 8 bytes (hex): $hex"

          # Make Tauri use this file
          "TAURI_CONFIG=src-tauri/tauri.conf.json" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Build with official action (installs WiX etc.)
      - name: Build Tauri (Windows) via action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # Upload the produced installers
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.zip

